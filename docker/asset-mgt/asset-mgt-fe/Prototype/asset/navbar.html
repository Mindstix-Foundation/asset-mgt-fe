/* Navigation links styling */
.navbar-nav .nav-link {

}

.navbar-nav .nav-link:hover {
    background-color: var(--primary-light-gray) !important;
    color: var(--primary-black) !important;
    transform: translateY(-1px);

.navbar-nav .nav-link.active {

    color: var(--primary-black) !important;

<script>
// Set active nav link based on current page
document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.navbar-nav .nav-link');
    
    // Remove active class from all links
    navLinks.forEach(link => link.classList.remove('active'));
    
    // Add active class to current page link
    navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (href && currentPath.includes(href.replace('.html', ''))) {
            link.classList.add('active');
        }
    });
    
    // Handle special cases
    if (currentPath.includes('dashboard') || currentPath.endsWith('/') || currentPath.includes('index')) {
        document.getElementById('nav-dashboard')?.classList.add('active');
    } else if (currentPath.includes('assets')) {
        document.getElementById('nav-assets')?.classList.add('active');
    } else if (currentPath.includes('employees')) {
        document.getElementById('nav-employees')?.classList.add('active');
    } else if (currentPath.includes('maintenance')) {
        document.getElementById('nav-maintenance')?.classList.add('active');
    } else if (currentPath.includes('vendors')) {
        document.getElementById('nav-vendors')?.classList.add('active');
    } else if (currentPath.includes('reports')) {
        document.getElementById('nav-reports')?.classList.add('active');
    }
});
</script>
