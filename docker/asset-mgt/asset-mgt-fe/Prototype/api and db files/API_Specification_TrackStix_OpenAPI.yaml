openapi: 3.0.3
info:
  title: TrackStix - Asset Management System API
  description: |
    Comprehensive API for managing assets, employees, assignments, and maintenance in an enterprise environment.
    
    ## Key Features
    - Asset lifecycle management
    - Employee and asset assignment tracking
    - Maintenance scheduling and records
    - Comprehensive reporting and analytics
    - Role-based access control
    
    ## Database Schema Alignment
    This API is fully aligned with the PostgreSQL database schema, using proper foreign key relationships and ENUM values.
  version: 1.0.0
  contact:
    name: Mindstix Software Labs
    email: support@mindstix.com
  license:
    name: Proprietary
    url: https://mindstix.com/license

servers:
  - url: https://api.trackstix.mindstix.com/v1
    description: Production server
  - url: https://staging-api.trackstix.mindstix.com/v1
    description: Staging server
  - url: http://localhost:3000/v1
    description: Development server

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Authentication
      description: Authenticate user and receive access token
      security: []
      parameters:
        - name: api_key
          in: header
          required: true
          schema:
            type: string
          description: API key for request validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "john.doe"
                password:
                  type: string
                  format: password
                  example: "securePassword123"
            example:
              username: "john.doe"
              password: "securePassword123"
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                message: "Authentication successful"
                data:
                  auth_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    id: "usr_001"
                    username: "john.doe"
                    role: "admin"
                    permissions: ["asset:read", "asset:write", "employee:read"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: Get Dashboard Statistics
      description: Retrieve real-time dashboard statistics and KPIs
      parameters:
        - name: dateRange
          in: query
          schema:
            type: string
            enum: ["7d", "30d", "1m", "3m", "6m", "1y"]
            default: "30d"
          description: Date range for statistics filtering
      responses:
        '200':
          description: Dashboard statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
              example:
                message: "Dashboard statistics retrieved successfully"
                data:
                  total_assets:
                    count: 1247
                    trend: 8.5
                  available_assets:
                    count: 312
                    percentage: 25.0
                    trend: 5.7
                  assigned_assets:
                    count: 892
                    percentage: 71.5
                    trend: 12.3
                  in_maintenance:
                    count: 43
                    percentage: 3.4
                    trend: -2.1
                  retired_assets:
                    count: 0
                    percentage: 0.0
                    trend: 0.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /assets:
    get:
      tags:
        - Assets
      summary: Get All Assets
      description: Retrieve all assets with pagination and filtering options
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema:
            type: string
          description: Search term for asset_id, serial_number, or location
        - name: category_id
          in: query
          schema:
            type: integer
          description: Filter by asset category ID
        - name: asset_type_id
          in: query
          schema:
            type: integer
          description: Filter by asset type ID
        - name: brand_id
          in: query
          schema:
            type: integer
          description: Filter by brand ID
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssetStatus'
          description: Filter by asset status
        - name: condition
          in: query
          schema:
            $ref: '#/components/schemas/AssetCondition'
          description: Filter by asset condition
      responses:
        '200':
          description: Assets retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetsListResponse'
              example:
                message: "Assets retrieved successfully"
                data:
                  assets:
                    - id: 1
                      asset_id: "AST-001"
                      asset_type_id: 1
                      brand_id: 1
                      model_id: 1
                      serial_number: "SERIAL123"
                      purchase_date: "2024-01-15"
                      purchase_cost: 2500.00
                      vendor_id: 1
                      warranty_start_date: "2024-01-15"
                      warranty_end_date: "2027-01-15"
                      location: "Warehouse A"
                      condition: "NEW"
                      status: "AVAILABLE"
                      notes: "New laptop for development team"
                      qr_code: "QR123456"
                      image_url: "https://example.com/asset.jpg"
                      created_at: "2024-01-15T10:30:00Z"
                      category_name: "Electronics"
                      type_name: "Laptop"
                      brand_name: "Apple"
                      model_name: "MacBook Pro 16\""
                      vendor_name: "Apple Store"
                  pagination:
                    total_count: 1247
                    current_page: 1
                    total_pages: 125
                    has_next: true
                    has_previous: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Assets
      summary: Create Asset
      description: Register a new asset in the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
            example:
              asset_type_id: 1
              brand_id: 1
              model_id: 5
              serial_number: "ABC123XYZ"
              purchase_date: "2024-08-08"
              purchase_cost: 2500.00
              vendor_id: 1
              warranty_start_date: "2024-08-08"
              warranty_end_date: "2027-08-08"
              location: "Warehouse A"
              condition: "NEW"
              status: "AVAILABLE"
              notes: "New development laptop"
              qr_code: "QR789012"
              image_url: "https://example.com/laptop.jpg"
      responses:
        '201':
          description: Asset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
              example:
                message: "Asset created successfully"
                data:
                  asset:
                    id: 1248
                    asset_id: "AST-1248"
                    asset_type_id: 1
                    brand_id: 1
                    model_id: 5
                    serial_number: "ABC123XYZ"
                    status: "AVAILABLE"
                    condition: "NEW"
                    created_at: "2024-08-08T10:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /employees:
    get:
      tags:
        - Employees
      summary: Get All Employees
      description: Retrieve all employees with their assigned assets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema:
            type: string
          description: Search by employee name, employee_id, or email
      responses:
        '200':
          description: Employees retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeesListResponse'
              example:
                message: "Employees retrieved successfully"
                data:
                  employees:
                    - id: 1
                      employee_id: "EMP-001"
                      first_name: "John"
                      last_name: "Doe"
                      email: "john.doe@mindstix.com"
                      phone: "+91-9876543210"
                      date_of_birth: "1990-05-15"
                      address: "123 Main Street, Pune, Maharashtra"
                      created_at: "2022-01-15T10:30:00Z"
                      updated_at: "2024-01-15T10:30:00Z"
                      assigned_assets: ["AST-001", "AST-002"]
                  pagination:
                    total_count: 150
                    current_page: 1
                    total_pages: 15
                    has_next: true
                    has_previous: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Employees
      summary: Create Employee
      description: Add a new employee to the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
            example:
              first_name: "John"
              last_name: "Doe"
              email: "john.doe@mindstix.com"
              phone: "+91-9876543210"
              date_of_birth: "1990-05-15"
              address: "123 Main Street, Pune, Maharashtra"
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
              example:
                message: "Employee created successfully"
                data:
                  employee:
                    id: 151
                    employee_id: "EMP-151"
                    first_name: "John"
                    last_name: "Doe"
                    email: "john.doe@mindstix.com"
                    created_at: "2024-08-08T10:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /assignments:
    post:
      tags:
        - Assignments
      summary: Assign Asset to Employee
      description: Assign an available asset to an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
            example:
              asset_id: 1
              employee_id: 1
              assigned_date: "2024-08-08"
              expected_return_date: "2024-12-31"
              assignment_reason: "Work laptop"
              notes: "Assigned for project development"
      responses:
        '201':
          description: Asset assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
              example:
                message: "Asset assigned successfully"
                data:
                  assignment:
                    id: 1
                    asset_id: 1
                    employee_id: 1
                    assigned_date: "2024-08-08"
                    assignment_reason: "Work laptop"
                    is_active: true
                    created_at: "2024-08-08T10:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /assignments/{assignment_id}/return:
    put:
      tags:
        - Assignments
      summary: Collect Asset from Employee
      description: Collect an assigned asset from an employee (return process)
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: integer
          description: ID of the assignment to return/collect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnAssetRequest'
            example:
              return_date: "2024-08-08"
              return_condition: "GOOD"
              return_reason: "Employee Left"
              notes: "Asset returned in good condition"
      responses:
        '200':
          description: Asset returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
              example:
                message: "Asset returned successfully"
                data:
                  assignment:
                    id: 1
                    asset_id: 1
                    employee_id: 1
                    return_date: "2024-08-08"
                    return_condition: "GOOD"
                    return_reason: "Employee Left"
                    is_active: false
                    updated_at: "2024-08-08T10:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination
    
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Number of items per page

  schemas:
    # Enums
    AssetStatus:
      type: string
      enum: [AVAILABLE, ASSIGNED, IN_MAINTENANCE, RETIRED, LOST]
      description: Asset status enumeration
    
    AssetCondition:
      type: string
      enum: [NEW, GOOD, FAIR, POOR, DAMAGED]
      description: Asset condition enumeration
    
    ReturnCondition:
      type: string
      enum: [GOOD, FAIR, POOR, DAMAGED]
      description: Return condition enumeration
    
    MaintenanceStatus:
      type: string
      enum: [SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED]
      description: Maintenance status enumeration

    # Base Response Structure
    BaseResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          description: Response message
        data:
          type: object
          description: Response data

    # Error Response
    ErrorResponse:
      type: object
      required:
        - message
        - error
      properties:
        message:
          type: string
          description: Error message
        error:
          type: string
          description: Detailed error description

    # Pagination
    Pagination:
      type: object
      properties:
        total_count:
          type: integer
          description: Total number of items
        current_page:
          type: integer
          description: Current page number
        total_pages:
          type: integer
          description: Total number of pages
        has_next:
          type: boolean
          description: Whether there is a next page
        has_previous:
          type: boolean
          description: Whether there is a previous page

    # Authentication
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                auth_key:
                  type: string
                  description: JWT token for authentication
                user:
                  $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          description: User ID
        username:
          type: string
          description: Username
        role:
          type: string
          enum: [admin, manager, employee]
          description: User role
        permissions:
          type: array
          items:
            type: string
          description: User permissions

    # Dashboard
    DashboardStatsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                total_assets:
                  $ref: '#/components/schemas/StatItem'
                available_assets:
                  $ref: '#/components/schemas/StatItemWithPercentage'
                assigned_assets:
                  $ref: '#/components/schemas/StatItemWithPercentage'
                in_maintenance:
                  $ref: '#/components/schemas/StatItemWithPercentage'
                retired_assets:
                  $ref: '#/components/schemas/StatItemWithPercentage'

    StatItem:
      type: object
      properties:
        count:
          type: integer
          description: Count of items
        trend:
          type: number
          format: float
          description: Trend percentage

    StatItemWithPercentage:
      allOf:
        - $ref: '#/components/schemas/StatItem'
        - type: object
          properties:
            percentage:
              type: number
              format: float
              description: Percentage of total

    # Assets
    Asset:
      type: object
      properties:
        id:
          type: integer
          description: Internal asset ID
        asset_id:
          type: string
          description: Custom asset ID (e.g., AST-001)
        asset_type_id:
          type: integer
          description: Asset type ID
        brand_id:
          type: integer
          description: Brand ID
        model_id:
          type: integer
          description: Model ID
        serial_number:
          type: string
          description: Manufacturer serial number
        purchase_date:
          type: string
          format: date
          description: Purchase date
        purchase_cost:
          type: number
          format: decimal
          description: Purchase cost
        vendor_id:
          type: integer
          description: Vendor ID
        warranty_start_date:
          type: string
          format: date
          description: Warranty start date
        warranty_end_date:
          type: string
          format: date
          description: Warranty end date
        location:
          type: string
          description: Asset location
        condition:
          $ref: '#/components/schemas/AssetCondition'
        status:
          $ref: '#/components/schemas/AssetStatus'
        notes:
          type: string
          description: Additional notes
        qr_code:
          type: string
          description: QR code for asset identification
        image_url:
          type: string
          format: uri
          description: URL to asset image
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        category_name:
          type: string
          description: Asset category name
        type_name:
          type: string
          description: Asset type name
        brand_name:
          type: string
          description: Brand name
        model_name:
          type: string
          description: Model name
        vendor_name:
          type: string
          description: Vendor name

    CreateAssetRequest:
      type: object
      required:
        - asset_type_id
        - brand_id
        - model_id
        - serial_number
      properties:
        asset_type_id:
          type: integer
          description: Asset type ID (required)
        brand_id:
          type: integer
          description: Brand ID (required)
        model_id:
          type: integer
          description: Model ID (required)
        serial_number:
          type: string
          description: Unique manufacturer serial number (required)
        purchase_date:
          type: string
          format: date
          description: Purchase date
        purchase_cost:
          type: number
          format: decimal
          description: Purchase cost
        vendor_id:
          type: integer
          description: Vendor ID
        warranty_start_date:
          type: string
          format: date
          description: Warranty start date
        warranty_end_date:
          type: string
          format: date
          description: Warranty end date
        location:
          type: string
          description: Asset location
        condition:
          $ref: '#/components/schemas/AssetCondition'
          default: NEW
        status:
          $ref: '#/components/schemas/AssetStatus'
          default: AVAILABLE
        notes:
          type: string
          description: Additional notes
        qr_code:
          type: string
          description: QR code for asset identification
        image_url:
          type: string
          format: uri
          description: URL to asset image

    AssetsListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                assets:
                  type: array
                  items:
                    $ref: '#/components/schemas/Asset'
                pagination:
                  $ref: '#/components/schemas/Pagination'

    AssetResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                asset:
                  $ref: '#/components/schemas/Asset'

    # Employees
    Employee:
      type: object
      properties:
        id:
          type: integer
          description: Internal employee ID
        employee_id:
          type: string
          description: Custom employee ID (e.g., EMP-001)
        first_name:
          type: string
          description: First name
        last_name:
          type: string
          description: Last name
        email:
          type: string
          format: email
          description: Email address
        phone:
          type: string
          description: Phone number with country code
        date_of_birth:
          type: string
          format: date
          description: Date of birth
        address:
          type: string
          description: Home address
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        assigned_assets:
          type: array
          items:
            type: string
          description: List of assigned asset IDs

    CreateEmployeeRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
      properties:
        first_name:
          type: string
          description: First name (required)
        last_name:
          type: string
          description: Last name (required)
        email:
          type: string
          format: email
          description: Email address (required, must be unique)
        phone:
          type: string
          description: Phone number with country code
        date_of_birth:
          type: string
          format: date
          description: Date of birth
        address:
          type: string
          description: Home address

    EmployeesListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                employees:
                  type: array
                  items:
                    $ref: '#/components/schemas/Employee'
                pagination:
                  $ref: '#/components/schemas/Pagination'

    EmployeeResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                employee:
                  $ref: '#/components/schemas/Employee'

    # Assignments
    Assignment:
      type: object
      properties:
        id:
          type: integer
          description: Assignment ID
        asset_id:
          type: integer
          description: Asset ID
        employee_id:
          type: integer
          description: Employee ID
        assigned_by:
          type: integer
          description: User ID who assigned the asset
        assigned_date:
          type: string
          format: date
          description: Assignment date
        expected_return_date:
          type: string
          format: date
          description: Expected return date
        return_date:
          type: string
          format: date
          description: Actual return date
        return_condition:
          $ref: '#/components/schemas/ReturnCondition'
        assignment_reason:
          type: string
          description: Reason for assignment
        return_reason:
          type: string
          description: Reason for return
        notes:
          type: string
          description: Additional notes
        is_active:
          type: boolean
          description: Whether assignment is active
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    CreateAssignmentRequest:
      type: object
      required:
        - asset_id
        - employee_id
        - assigned_date
      properties:
        asset_id:
          type: integer
          description: ID of the asset to be assigned (required)
        employee_id:
          type: integer
          description: ID of the employee to assign the asset to (required)
        assigned_date:
          type: string
          format: date
          description: Assignment date (required)
        expected_return_date:
          type: string
          format: date
          description: Expected return date
        assignment_reason:
          type: string
          description: Reason for assignment
        notes:
          type: string
          description: Additional notes

    ReturnAssetRequest:
      type: object
      required:
        - return_date
        - return_condition
      properties:
        return_date:
          type: string
          format: date
          description: Return date (required)
        return_condition:
          $ref: '#/components/schemas/ReturnCondition'
          description: Condition of the asset when returned (required)
        return_reason:
          type: string
          description: Reason for return
        notes:
          type: string
          description: Additional notes

    AssignmentResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                assignment:
                  $ref: '#/components/schemas/Assignment'

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
