# SonarQube configuration for Asset Management Frontend
sonar.projectKey=asset-fe
sonar.projectName=Asset Management Frontend
sonar.projectVersion=1.0.0

# SonarQube server URL
sonar.host.url=http://localhost:9000

# Authentication token
sonar.token=sqp_231aa13f96edb354887ff066b981fc8ce3c63fdd

# Source code directory
sonar.sources=src

# TypeScript/JavaScript files
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test files
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js

# Exclude node_modules and build directories
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.d.ts

# Language settings
sonar.sourceEncoding=UTF-8

# Coverage settings
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js,**/*.d.ts

# TypeScript settings
sonar.typescript.tsconfigPath=tsconfig.json

# ESLint settings
sonar.eslint.reportPaths=eslint-report.json

# Vue.js specific settings
sonar.javascript.file.suffixes=.js,.jsx,.vue
sonar.typescript.file.suffixes=.ts,.tsx
