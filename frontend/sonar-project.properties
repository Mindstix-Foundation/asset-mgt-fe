# SonarQube Configuration for Asset Management Frontend (Vue.js)
sonar.projectKey=asset-fronend
sonar.projectName=Pebble Asset Tracker Frontend
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js,**/*.d.ts

# TypeScript/JavaScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.app.json

# Coverage configuration
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js,**/main.ts,**/vite.config.ts,**/*.d.ts

# Vue.js specific configuration
sonar.javascript.file.suffixes=.js,.jsx,.vue
sonar.typescript.file.suffixes=.ts,.tsx

# Additional exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/public/**,**/env.d.ts

# Encoding
sonar.sourceEncoding=UTF-8

# Issue exclusions - False positives for Vue.js dynamic ARIA attributes
# SonarQube cannot detect ARIA attributes bound via Vue's : syntax
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# Ignore Web:S6807 (missing ARIA attributes) in SearchableDropdown.vue - false positive, attributes are present via Vue binding
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S6807
sonar.issue.ignore.multicriteria.e1.resourceKey=**/SearchableDropdown.vue

# Ignore Web:S6807 (missing aria-checked) in ManageAssetCategoriesView.vue - false positive, aria-checked is present via Vue binding on line 206
sonar.issue.ignore.multicriteria.e4.ruleKey=Web:S6807
sonar.issue.ignore.multicriteria.e4.resourceKey=**/ManageAssetCategoriesView.vue

# Ignore Web:S6819 (prefer semantic tags) in SearchableDropdown.vue - custom dropdown requires ARIA roles for filtering
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e2.resourceKey=**/SearchableDropdown.vue

# Ignore accessibility warnings for custom dropdown component with proper ARIA implementation
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.vue

# Analysis parameters (set SONAR_TOKEN env var, or pass -Dsonar.token=...)
sonar.host.url=http://localhost:9000
