<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Management Tool - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body style="background-color: #ffffff;">
    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100">
            <div class="col-12 col-md-6 col-lg-4 mx-auto">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-building fa-3x mb-3" style="color: #007bff;"></i>
                            <h2 class="fw-bold text-dark">Asset Management</h2>
                            <p class="text-muted">Secure access to your asset portal</p>
                        </div>
                        
                        <form class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="userType" class="form-label fw-semibold">Login As</label>
                                <select class="form-select" id="userType" required>
                                    <option value="">Select User Type</option>
                                    <option value="admin">Administrator</option>
                                    <option value="hr">HR</option>
                                </select>
                                <div class="invalid-feedback">
                                    Please select a user type.
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background-color: var(--mindstix-light); border-color: var(--mindstix-border); color: var(--mindstix-primary);"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                                    <div class="invalid-feedback">
                                        Please enter a username.
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background-color: var(--mindstix-light); border-color: var(--mindstix-border); color: var(--mindstix-primary);"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword" style="border-color: var(--mindstix-border); color: var(--mindstix-primary);">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <div class="invalid-feedback">
                                        Please enter a password.
                                    </div>
                                </div>
                            </div>
                            
                            <a href="pages/dashboard/dashboard.html" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </a>
                        </form>
                        
                        <div class="text-center mt-4">
                            <small class="text-muted">
                                Demo Credentials:<br>
                                Admin: admin/admin123<br>
                                HR: hr001/hr123<br>
                                <em>(For prototype - any credentials work)</em>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Bootstrap form validation
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var forms = document.getElementsByClassName('needs-validation');
                var validation = Array.prototype.filter.call(forms, function(form) {
                    form.addEventListener('submit', function(event) {
                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();

        // Password toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            
            if (togglePassword && password) {
                togglePassword.addEventListener('click', function() {
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    
                    const icon = this.querySelector('i');
                    if (type === 'password') {
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                    } else {
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                    }
                });
            }

            // Make login button work with form validation
            const loginBtn = document.getElementById('loginBtn');
            const form = document.querySelector('.needs-validation');
            
            if (loginBtn && form) {
                loginBtn.addEventListener('click', function(e) {
                    if (!form.checkValidity()) {
                        e.preventDefault();
                        form.classList.add('was-validated');
                        return false;
                    }
                    // If form is valid, the href will work normally
                });
            }
        });
    </script>
</body>
</html>
