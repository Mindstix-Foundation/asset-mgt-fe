<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Management - Register New Asset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    
    <!-- Include navbar CSS -->
    <link rel="stylesheet" href="../asset/navbar.css">
</head>
<body style="background-color: #f8f9fa;">

    <!-- Main Content -->
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="card-title mb-0">
                            <i class="fas fa-plus me-2"></i>Register New Asset
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Asset ID</label>
                                    <input type="text" class="form-control" placeholder="AST-001" readonly>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Asset Type</label>
                                    <select class="form-select">
                                        <option>Laptop</option>
                                        <option>Monitor</option>
                                        <option>Mobile Device</option>
                                        <option>Tablet</option>
                                        <option>Accessories</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Brand</label>
                                    <select class="form-select">
                                        <option value="">Select Brand</option>
                                        <option>Apple</option>
                                        <option>Dell</option>
                                        <option>HP</option>
                                        <option>Lenovo</option>
                                        <option>Microsoft</option>
                                        <option>Samsung</option>
                                        <option>LG</option>
                                        <option>ASUS</option>
                                        <option>Acer</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Model</label>
                                    <select class="form-select">
                                        <option value="">Select Model</option>
                                        <option>MacBook Pro 13"</option>
                                        <option>MacBook Pro 14"</option>
                                        <option>MacBook Pro 16"</option>
                                        <option>MacBook Air 13"</option>
                                        <option>iMac 24"</option>
                                        <option>Dell XPS 13</option>
                                        <option>Dell XPS 15</option>
                                        <option>Dell Inspiron</option>
                                        <option>HP EliteBook</option>
                                        <option>HP Pavilion</option>
                                        <option>ThinkPad X1</option>
                                        <option>ThinkPad T Series</option>
                                        <option>Surface Laptop</option>
                                        <option>Surface Pro</option>
                                        <option>iPhone 14</option>
                                        <option>iPhone 15</option>
                                        <option>iPad Pro</option>
                                        <option>iPad Air</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Serial Number</label>
                                    <input type="text" class="form-control" placeholder="ABC123XYZ">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Purchase Date <small class="text-muted">(Optional)</small></label>
                                    <input type="date" class="form-control">
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between mt-4">
                                <button type="button" class="btn btn-secondary" onclick="history.back()">
                                    <i class="fas fa-arrow-left me-1"></i>Cancel
                                </button>
                                <button type="button" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>Register Asset
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Include navbar JavaScript -->
    <script src="../asset/navbar.js"></script>
    <script src="../script.js"></script>
</body>
</html>
