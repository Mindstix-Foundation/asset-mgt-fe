<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Management - Collect Asset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    <link rel="stylesheet" href="../asset/navbar.css">
</head>
<body style="background-color: #f8f9fa;">
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <div class="card shadow-sm border-0" style="border-radius: 1.5rem;">
                    <div class="card-header bg-white border-0 text-center py-4" style="border-radius: 1.5rem 1.5rem 0 0;">
                        <div class="d-flex align-items-center justify-content-center mb-2">
                            <div class="stats-icon bg-danger bg-opacity-10 rounded-circle p-3 me-3">
                                <i class="fas fa-user-minus text-danger fa-lg"></i>
                            </div>
                            <div>
                                <h4 class="card-title mb-0 fw-bold text-dark">Collect Asset from Employee</h4>
                                <p class="text-muted mb-0 small">Retrieve an assigned asset from an employee</p>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-4 p-lg-5">
                        <form class="needs-validation" novalidate>
                            <!-- Asset Selection Section -->
                            <div class="mb-5">
                                <div class="d-flex align-items-center mb-4">
                                    <div class="asset-type-icon accessories me-3" style="width: 40px; height: 40px; font-size: 1rem;">
                                        <i class="fas fa-laptop"></i>
                                    </div>
                                    <h6 class="mb-0 fw-semibold text-dark">Select Asset to Collect</h6>
                                </div>
                                <div class="row g-4">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <select class="form-select" id="assetId" required>
                                                <option value="">Choose an assigned asset...</option>
                                                <option value="AST-001">AST-001 - MacBook Pro 16" (John Doe)</option>
                                                <option value="AST-002">AST-002 - Dell Monitor 27" (Jane Smith)</option>
                                                <option value="AST-003">AST-003 - iPhone 14 Pro (Mike Johnson)</option>
                                                <option value="AST-004">AST-004 - Surface Laptop (Sarah Wilson)</option>
                                                <option value="AST-005">AST-005 - iPad Pro (David Brown)</option>
                                            </select>
                                            <label for="assetId">
                                                <i class="fas fa-tag me-2 text-muted"></i>Asset ID
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" id="currentEmployee" placeholder="Current Employee" readonly style="background-color: #f8f9fa;">
                                            <label for="currentEmployee">
                                                <i class="fas fa-user me-2 text-muted"></i>Current Employee
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Collection Details Section -->
                            <div class="mb-5">
                                <div class="d-flex align-items-center mb-4">
                                    <div class="asset-type-icon mobile me-3" style="width: 40px; height: 40px; font-size: 1rem;">
                                        <i class="fas fa-calendar-alt"></i>
                                    </div>
                                    <h6 class="mb-0 fw-semibold text-dark">Collection Details</h6>
                                </div>
                                <div class="row g-4">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <input type="date" class="form-control" id="collectionDate" required>
                                            <label for="collectionDate">
                                                <i class="fas fa-calendar me-2 text-muted"></i>Collection Date
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <select class="form-select" id="collectionReason" required>
                                                <option value="">Choose reason...</option>
                                                <option value="employee-left" selected>Employee Left</option>
                                                <option value="reassignment">Asset Reassignment</option>
                                                <option value="maintenance">Maintenance Required</option>
                                                <option value="upgrade">Upgrade</option>
                                                <option value="other">Other</option>
                                            </select>
                                            <label for="collectionReason">
                                                <i class="fas fa-question-circle me-2 text-muted"></i>Reason
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <textarea class="form-control" id="collectionNotes" placeholder="Collection Notes" style="height: 120px;"></textarea>
                                            <label for="collectionNotes">
                                                <i class="fas fa-sticky-note me-2 text-muted"></i>Collection Notes
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Action Buttons -->
                            <div class="d-flex flex-column flex-sm-row justify-content-between gap-3 mt-5">
                                <button type="button" class="btn btn-outline-secondary btn-lg px-4" onclick="history.back()">
                                    <i class="fas fa-arrow-left me-2"></i>Cancel
                                </button>
                                <button type="submit" class="btn btn-danger btn-lg px-4">
                                    <i class="fas fa-user-minus me-2"></i>Collect Asset
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="successToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-success text-white">
                <i class="fas fa-check-circle me-2"></i>
                <strong class="me-auto">Success</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                Asset has been collected successfully!
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 1rem;">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="confirmationModalLabel">
                        <i class="fas fa-exclamation-triangle text-warning me-2"></i>Confirm Asset Collection
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-3">Are you sure you want to collect this asset?</p>
                    <div class="bg-light p-3 rounded">
                        <div class="row">
                            <div class="col-sm-4 fw-semibold">Asset:</div>
                            <div class="col-sm-8" id="modalAssetInfo">-</div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4 fw-semibold">Employee:</div>
                            <div class="col-sm-8" id="modalEmployeeInfo">-</div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4 fw-semibold">Reason:</div>
                            <div class="col-sm-8" id="modalReasonInfo">-</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>Cancel
                    </button>
                    <button type="button" class="btn btn-danger" id="confirmCollectBtn">
                        <i class="fas fa-user-minus me-2"></i>Confirm Collection
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../asset/navbar.js"></script>
    <script src="../script.js"></script>
    
    <script>
        // Form validation and enhancement
        (function() {
            'use strict';
            
            // Set today's date as default
            document.getElementById('collectionDate').value = new Date().toISOString().split('T')[0];
            
            // Mock data for demonstration
            const assignedAssets = {
                'AST-001': { 
                    name: 'MacBook Pro 16"', 
                    employee: 'John Doe',
                    type: 'Laptop'
                },
                'AST-002': { 
                    name: 'Dell Monitor 27"', 
                    employee: 'Jane Smith',
                    type: 'Monitor'
                },
                'AST-003': { 
                    name: 'iPhone 14 Pro', 
                    employee: 'Mike Johnson',
                    type: 'Mobile Device'
                },
                'AST-004': { 
                    name: 'Surface Laptop', 
                    employee: 'Sarah Wilson',
                    type: 'Laptop'
                },
                'AST-005': { 
                    name: 'iPad Pro', 
                    employee: 'David Brown',
                    type: 'Tablet'
                }
            };
            
            const reasonLabels = {
                'employee-left': 'Employee Left',
                'reassignment': 'Asset Reassignment',
                'maintenance': 'Maintenance Required',
                'upgrade': 'Upgrade',
                'other': 'Other'
            };
            
            // Asset selection handler
            document.getElementById('assetId').addEventListener('change', function() {
                const selectedAsset = assignedAssets[this.value];
                const currentEmployeeField = document.getElementById('currentEmployee');
                
                if (selectedAsset) {
                    currentEmployeeField.value = selectedAsset.employee;
                } else {
                    currentEmployeeField.value = '';
                }
            });
            
            // Bootstrap form validation
            const forms = document.querySelectorAll('.needs-validation');
            const confirmationModal = new bootstrap.Modal(document.getElementById('confirmationModal'));
            
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    
                    if (form.checkValidity()) {
                        // Show confirmation modal
                        const assetId = document.getElementById('assetId').value;
                        const reason = document.getElementById('collectionReason').value;
                        const asset = assignedAssets[assetId];
                        
                        if (asset) {
                            document.getElementById('modalAssetInfo').textContent = `${assetId} - ${asset.name}`;
                            document.getElementById('modalEmployeeInfo').textContent = asset.employee;
                            document.getElementById('modalReasonInfo').textContent = reasonLabels[reason] || reason;
                            
                            confirmationModal.show();
                        }
                    }
                    
                    form.classList.add('was-validated');
                }, false);
            });
            
            // Confirmation modal handler
            document.getElementById('confirmCollectBtn').addEventListener('click', function() {
                confirmationModal.hide();
                
                // Show success toast
                const toast = new bootstrap.Toast(document.getElementById('successToast'));
                toast.show();
                
                // Reset form after a delay
                setTimeout(() => {
                    const form = document.querySelector('.needs-validation');
                    form.reset();
                    form.classList.remove('was-validated');
                    document.getElementById('collectionDate').value = new Date().toISOString().split('T')[0];
                    document.getElementById('currentEmployee').value = '';
                }, 2000);
            });
        })();
    </script>
</body>
</html>
