<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Management - Collect Asset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    
    <!-- Include navbar CSS -->
    <link rel="stylesheet" href="../asset/navbar.css">
</head>
<body style="background-color: #f8f9fa;">

    <!-- Main Content -->
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card shadow-sm">
                    <div class="card-header bg-danger text-white">
                        <h4 class="card-title mb-0">
                            <i class="fas fa-user-minus me-2"></i>Collect Asset from Employee
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            <div class="row">
                                <!-- Asset Selection -->
                                <div class="col-12 mb-4">
                                    <h6 class="text-muted mb-3">
                                        <i class="fas fa-laptop me-2"></i>Select Asset to Collect
                                    </h6>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Asset ID</label>
                                            <select class="form-select">
                                                <option value="">Select an assigned asset...</option>
                                                <option>AST-001 - MacBook Pro 16" (John Doe)</option>
                                                <option>AST-002 - Dell Monitor 27" (Jane Smith)</option>
                                                <option>AST-003 - iPhone 14 Pro (Mike Johnson)</option>
                                                <option>AST-004 - Surface Laptop (Sarah Wilson)</option>
                                                <option>AST-005 - iPad Pro (David Brown)</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Current Employee</label>
                                            <input type="text" class="form-control" placeholder="Will auto-populate" readonly>
                                        </div>
                                    </div>
                                </div>

                                <!-- Collection Details -->
                                <div class="col-12">
                                    <h6 class="text-muted mb-3">
                                        <i class="fas fa-calendar-alt me-2"></i>Collection Details
                                    </h6>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Collection Date</label>
                                            <input type="date" class="form-control" value="2024-03-20">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Reason</label>
                                            <select class="form-select">
                                                <option>Employee Left</option>
                                                <option>Asset Reassignment</option>
                                                <option>Maintenance Required</option>
                                                <option>Upgrade</option>
                                                <option>Other</option>
                                            </select>
                                        </div>
                                        <div class="col-12 mb-3">
                                            <label class="form-label">Collection Notes</label>
                                            <textarea class="form-control" rows="3" placeholder="Add any notes about the asset collection..."></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between mt-4">
                                <button type="button" class="btn btn-secondary" onclick="history.back()">
                                    <i class="fas fa-arrow-left me-1"></i>Cancel
                                </button>
                                <button type="button" class="btn btn-danger">
                                    <i class="fas fa-user-minus me-1"></i>Collect Asset
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Include navbar JavaScript -->
    <script src="../asset/navbar.js"></script>
    <script src="../script.js"></script>
</body>
</html>
