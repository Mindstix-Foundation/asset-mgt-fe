<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Management - Issue Asset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../styles.css" rel="stylesheet">
    
    <!-- Include navbar CSS -->
    <link rel="stylesheet" href="../asset/navbar.css">
</head>
<body style="background-color: #f8f9fa;">

    <!-- Main Content -->
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="card-title mb-0">
                            <i class="fas fa-user-plus me-2"></i>Issue Asset to Employee
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            <div class="row">
                                <!-- Asset Selection -->
                                <div class="col-12 mb-4">
                                    <h6 class="text-muted mb-3">
                                        <i class="fas fa-laptop me-2"></i>Select Asset
                                    </h6>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Asset ID</label>
                                            <select class="form-select">
                                                <option value="">Select an asset...</option>
                                                <option>AST-001 - MacBook Pro 16"</option>
                                                <option>AST-002 - Dell Monitor 27"</option>
                                                <option>AST-003 - iPhone 14 Pro</option>
                                                <option>AST-004 - Surface Laptop</option>
                                                <option>AST-005 - iPad Pro</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Asset Type</label>
                                            <input type="text" class="form-control" placeholder="Will auto-populate" readonly>
                                        </div>
                                    </div>
                                </div>

                                <!-- Employee Selection -->
                                <div class="col-12 mb-4">
                                    <h6 class="text-muted mb-3">
                                        <i class="fas fa-user me-2"></i>Select Employee
                                    </h6>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Employee ID</label>
                                            <input type="text" class="form-control" placeholder="Enter Employee ID (e.g., EMP-001)" id="employeeIdInput">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Employee Name</label>
                                            <input type="text" class="form-control" placeholder="Will auto-populate from Employee ID" readonly id="employeeNameDisplay">
                                        </div>
                                    </div>
                                </div>

                                <!-- Assignment Details -->
                                <div class="col-12">
                                    <h6 class="text-muted mb-3">
                                        <i class="fas fa-calendar-alt me-2"></i>Assignment Details
                                    </h6>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Assignment Date</label>
                                            <input type="date" class="form-control" value="2024-03-20">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Assignment Type</label>
                                            <select class="form-select">
                                                <option>Permanent Assignment</option>
                                                <option>Temporary Assignment</option>
                                                <option>Project-based</option>
                                                <option>Trial Period</option>
                                                <option>Mindstix Foundation</option>
                                            </select>
                                        </div>
                                        <div class="col-12 mb-3">
                                            <label class="form-label">Assignment Notes</label>
                                            <textarea class="form-control" rows="3" placeholder="Add any special instructions or notes for this assignment..."></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between mt-4">
                                <button type="button" class="btn btn-secondary" onclick="history.back()">
                                    <i class="fas fa-arrow-left me-1"></i>Cancel
                                </button>
                                <button type="button" class="btn btn-success">
                                    <i class="fas fa-check me-1"></i>Issue Asset
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Include navbar JavaScript -->
    <script src="../asset/navbar.js"></script>
    <script src="../script.js"></script>
</body>
</html>
